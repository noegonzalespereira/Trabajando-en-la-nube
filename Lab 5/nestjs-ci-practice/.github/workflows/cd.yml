name: CD - Production Deployment

on:
  push:
    branches: [main] # Se dispara cuando haces merge o push a main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nestjs-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/nestjs-app:latest

      # --- PASO DE SEGURIDAD: Escaneo con Trivy ---
      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nestjs-app:${{ github.sha }}
          format: 'table'
          exit-code: '0' # El pipeline sigue aunque encuentre vulnerabilidades (para reporte)
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # ESTO CONECTA CON TUS SECRETOS DE ENTORNO
    steps:
      - name: Desplegar en AWS EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/nestjs-app:latest"
            
            docker pull $IMAGE
            
            # Detenemos el contenedor anterior si existe
            docker stop nest-app || true
            docker rm nest-app || true
            
            # Despliegue en el puerto 80 (puedes cambiar a 3001 si prefieres)
            docker run -d --name nest-app --restart unless-stopped -p 80:3001 $IMAGE
            
            # Limpieza de imágenes viejas para no llenar el disco de la EC2
            docker system prune -f